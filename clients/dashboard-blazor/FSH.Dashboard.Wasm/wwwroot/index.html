<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>FullStackHero Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/FSH.BlazorShared/css/fsh.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div class="fsh-loading-container" role="status" aria-live="polite">
            <div class="fsh-loading-brand" aria-hidden="true">F</div>
            <div class="fsh-loading-spinner" aria-hidden="true"></div>
            <p class="fsh-loading-title">FullStackHero</p>
            <p class="fsh-loading-sub">Loading your dashboard…</p>
        </div>
    </div>
    <div id="blazor-error-ui" class="fsh-error-ui">
        <div class="fsh-error-content">
            <div>
                <p style="margin: 0;">An unhandled error has occurred.</p>
                <p class="fsh-error-detail" style="margin: 4px 0 0;"></p>
            </div>
            <button class="fsh-reload-btn" onclick="window.location.reload()">Reload</button>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/fshDownload.js"></script>
    <script src="js/fshSkipLink.js"></script>
    <script src="_content/FSH.BlazorShared/js/fshError.js"></script>
</body>
</html>
