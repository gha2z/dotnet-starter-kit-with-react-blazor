<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>FullStackHero Admin</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#E11D48" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="_framework/blazor.webassembly.js" as="script" />
    <link rel="preload" href="_framework/dotnet.js" as="script" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/FSH.BlazorShared/css/fsh.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <style>
        /* Critical splash CSS (wave 14) — inlined so first paint never waits on app.css */
        .fsh-loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #5C6B73;
        }

        .fsh-loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #D0D5DD;
            border-top-color: #5B8C5A;
            border-radius: 50%;
            animation: fsh-spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes fsh-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="fsh-loading-container">
            <div class="fsh-loading-spinner"></div>
            <p>Loading...</p>
        </div>
    </div>
    <div id="blazor-error-ui" class="fsh-error-ui">
        <div class="fsh-error-content">
            <div>
                <p style="margin: 0;">An unhandled error has occurred.</p>
                <p class="fsh-error-detail" style="margin: 4px 0 0;"></p>
            </div>
            <button class="fsh-reload-btn" onclick="window.location.reload()">Reload</button>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/fshDownload.js"></script>
    <script src="js/fshClipboard.js"></script>
    <script src="js/fshWindow.js"></script>
    <script src="_content/FSH.BlazorShared/js/fshError.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').catch(function() {});
        }
    </script>
</body>
</html>
